name: Automation WEB PGATS

on: 
  workflow_dispatch:

jobs:
  web-tests:

    runs-on: ubuntu-latest

    steps:
      #Clone do projeto para a máquina
      - uses: actions/checkout@v4

      #conferir a versão do node
      - name: Node Version
        run: node --version

      - name: Instalando dependências
        run: npm install

      - name: Executando os testes
        run: npx cypress run
