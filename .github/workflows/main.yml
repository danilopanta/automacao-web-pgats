name: Automation Web Tests PGATS

on:
  workflow_dispatch:

jobs:
  e2e-testes:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      # conferir a versao instalada
      - name: Node version
        run: node --version

      - name: Instalando dependencias
        run: npm install

      - name: Executando os testes
        run: npx cypress run
      
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled()}}
        with:
          name: relatorios-cypress-pgats
          path: |
            cypress/reports
            cypress/screenshots
            cypress/videos